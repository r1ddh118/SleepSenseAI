services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./datasets:/app/datasets
      - ./artifacts:/app/artifacts
      - sleepsense_sqlite:/app/db
    environment:
      - DATABASE_URL=sqlite:////app/db/sleepsense.db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      - ./src:/app/src
      - ./datasets:/app/datasets
      - ./artifacts:/app/artifacts
      - sleepsense_sqlite:/app/db
    environment:
      - DATABASE_URL=sqlite:////app/db/sleepsense.db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A tasks worker --loglevel=info

  # The current React UI is served by Vite in development.  It proxies API and
  # WebSocket calls to the API container, so Redis/Celery do not change which
  # frontend is shown in the browser.
  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

volumes:
  sleepsense_sqlite:
  frontend_node_modules:
